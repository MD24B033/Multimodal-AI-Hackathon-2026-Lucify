<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Lucify">
  <title>Lucify</title>
  <desc>An open book with a circuit brain, cycling through rest, brain pulse, book flip and tech connection.</desc>

  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="160" height="160" rx="36" fill="#ffffff"/>

  <g transform="translate(16 16) scale(2)">
    <ellipse cx="32" cy="21" rx="19" ry="15" fill="#ff8a3d" filter="url(#soft)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.22;0.32;0.46;1" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <g stroke="#0b0b0d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M32 56 5 46V22l27 10Z"/>
      <path d="M32 56 59 46V22L32 32Z">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1 1;1 1;0.12 1;1 1;1 1" keyTimes="0;0.5;0.58;0.68;1" dur="10s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 0;0 0;28.16 0;0 0;0 0" keyTimes="0;0.5;0.58;0.68;1" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M32 32v24" stroke-width="2.2"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;1;1.07;1;1" keyTimes="0;0.22;0.32;0.46;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 0;0 0;-2.24 -1.47;0 0;0 0" keyTimes="0;0.22;0.32;0.46;1" dur="10s" repeatCount="indefinite"/>

      <g stroke="#ff8a3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <path d="M32 6c-8-1.6-14.5 3-14.5 9.4-4.4 1.5-4.4 8.7 0 11 1.2 5 7.3 6.7 14.5 5.7Z"/>
        <path d="M32 6c8-1.6 14.5 3 14.5 9.4 4.4 1.5 4.4 8.7 0 11-1.2 5-7.3 6.7-14.5 5.7Z"/>
      </g>

      <g stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="14">
        <path d="M25 11v5h-5.6" stroke-dashoffset="14">
          <animate attributeName="stroke-dashoffset" values="14;14;0;0;14" keyTimes="0;0.72;0.84;0.95;1" dur="10s" repeatCount="indefinite"/>
        </path>
        <path d="M27.5 30h-5v-5.6" stroke-dashoffset="14">
          <animate attributeName="stroke-dashoffset" values="14;14;0;0;14" keyTimes="0;0.73;0.85;0.95;1" dur="10s" repeatCount="indefinite"/>
        </path>
        <path d="M39 11v5h5.6" stroke-dashoffset="14">
          <animate attributeName="stroke-dashoffset" values="14;14;0;0;14" keyTimes="0;0.74;0.86;0.95;1" dur="10s" repeatCount="indefinite"/>
        </path>
        <path d="M36.5 30h5v-5.6" stroke-dashoffset="14">
